<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pattern Factory</title>
    <script>
      // GitHub Pages SPA redirect
      // Encodes the path as a query param so index.html can restore it
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.host +
        l.pathname.split("/").slice(0, 2).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(1).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Needed so the deploy job can push the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build # production mode → picks up .env.production (VITE_API_URL)

      # Hand the built site to the deploy job so we don't build twice.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  server:
    name: Build server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to gh-pages
    runs-on: ubuntu-latest
    needs: [frontend, server] # only deploy if both builds pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true # keep gh-pages a clean, single-commit branch
